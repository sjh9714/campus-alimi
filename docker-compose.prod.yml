# 운영. VM 한 대에 postgres, app, web(Caddy) 셋. ADR 006.
# 이미지는 GitHub Actions가 빌드해 GHCR에 올린다(.github/workflows/images.yml). 서버는 받아서 띄우기만 한다.
#   cp .env.prod.example .env  → 값 채우기
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# 로컬에서 직접 빌드해 시험할 때만 up -d --build.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusalimi
      POSTGRES_USER: campusalimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusalimi"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/sjh9714/campus-alimi-app:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campusalimi
      DB_USER: campusalimi
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: https://${SITE_ADDRESS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      COOKIE_SECURE: "true"
      MAIL_MODE: ${MAIL_MODE:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # 메모리 1GB 서버(E2.1.Micro)에서는 .env에서 JAVA_TOOL_OPTIONS를 -Xmx256m 정도로 낮춘다.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -Duser.timezone=Asia/Seoul}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: ghcr.io/sjh9714/campus-alimi-web:${IMAGE_TAG:-latest}
    build: ./web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
