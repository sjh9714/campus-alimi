spring:
  application:
    name: campus-alimi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusalimi}
    username: ${DB_USER:campusalimi}
    password: ${DB_PASSWORD:campusalimi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# 메일 서버 접속은 헬스에 넣지 않는다. 콘솔 모드나 Gmail 일시 장애로 앱 전체가 DOWN이 되면 안 된다.
management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: https://www.catholic.ac.kr
  fetch-interval-ms: 1500
  run-once: ${RUN_ONCE:}
  # 로그인 링크와 화면 주소의 바탕. 로컬은 Next dev 서버, 운영은 Caddy가 받는 도메인
  public-url: ${PUBLIC_URL:http://localhost:3000}
  # 메일 링크가 가리킬 API 주소. 비우면 public-url. 로컬 개발은 http://localhost:8080
  api-url: ${API_URL:}
  admin-email: ${ADMIN_EMAIL:}
  cookie-secure: ${COOKIE_SECURE:false}
  mail:
    mode: ${MAIL_MODE:console}
    from: ${MAIL_FROM:campus-alimi@localhost}
  schedule:
    cron: "0 0 6 * * *"
    campus: 성심
    years: ${SCHEDULE_YEARS:2026,2027}
  notice:
    cron: "0 7 * * * *"
    page-size: 30
    categories:
      - name: 학사
        id: 21
      - name: 장학
        id: 22
