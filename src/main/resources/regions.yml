# 시·도와 시·군·구. 지역 장학 공지를 알아보고, 프로필의 연고 지역을 고르는 데 쓴다 (ADR 009).
# short는 공지 제목에 줄여 쓰는 이름이다 (전남인재육성, 대전청년내일재단).
# 2026년 7월 인천 행정체제 개편으로 생긴 구(영종구, 제물포구, 검단구)와 없어진 구(중구, 동구)를 함께 둔다.
